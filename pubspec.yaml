name: flutter_thai_hotline_app
description: A Thai hotline directory built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: '#F6F8FC'
    theme_color: '#102541'

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/travel/
    - assets/images/emergency/
    - assets/images/bank/
    - assets/images/pubutil/
    - assets/images/aboutme/
    - assets/fonts/OFL.txt
  fonts:
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Regular.ttf
        - asset: assets/fonts/Kanit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Kanit-SemiBold.ttf
          weight: 600

